services:
  postgres:
    # WHY: pgvector image = relational + vector search in one store.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
